# Application configuration, independent of board selection.
CONFIG_PRINTK=y
CONFIG_LED_STRIP=y
CONFIG_LOG=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# MPU-6050 over I2C (polling; data-ready interrupts need CONFIG_MPU6050_TRIGGER_OWN_THREAD)
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_MPU6050=y
CONFIG_MPU6050_TRIGGER_NONE=y

# Protobuf encoding (spec/motion.proto)
CONFIG_NANOPB=y

# Wi-Fi station with DHCPv4 and UDP sockets
CONFIG_WIFI=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16

# Randomness for the per-boot session ID (hardware RNG of the ESP32-S3)
CONFIG_ENTROPY_GENERATOR=y

# k_event for the Wi-Fi ready state
CONFIG_EVENTS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
